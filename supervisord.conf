[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:redis]
command=redis-server --port 6379
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:django]
command=bash -c "python manage.py migrate --noinput && (python manage.py createsuperuser --noinput || true) && daphne -b 0.0.0.0 -p 7860 backend.asgi:application"
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",REDIS_HOST="localhost",CELERY_BROKER_URL="redis://localhost:6379/0"

[program:celery]
command=python -m celery -A backend worker --loglevel=info
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",REDIS_HOST="localhost",CELERY_BROKER_URL="redis://localhost:6379/0"

[program:celery-beat]
command=python -m celery -A backend beat --loglevel=info
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",REDIS_HOST="localhost",CELERY_BROKER_URL="redis://localhost:6379/0"
